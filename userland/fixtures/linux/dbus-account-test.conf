<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Isolated acceptance bus, never the desktop's session/system bus.
     seed0root already starts the daemon as messagebus; no UID-changing wrapper. -->
<busconfig>
  <type>session</type>
  <listen>unix:abstract=pacha-account-test</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <deny user="*"/>
    <allow user="messagebus"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
  <limit name="auth_timeout">5000</limit>
</busconfig>
