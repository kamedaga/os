schema_version = 1

[app]
id = "curl"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/curl.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_curl.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "CURL.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/curl.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/curl"
