schema_version = 1

[app]
id = "seed2_root"
kind = "file"
role = "boot"

[source.file]
path = ".artifacts/cmake/seed2_root/seed2_root.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_seed2_root.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "SEED2RT.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/sbin/seed2.elf"
