schema_version = 1

[app]
id = "libsmoke"
kind = "file"
role = "service"

[source.file]
path = "userland/fixtures/libsmoke.so"
rebuild_tool = "zig"
rebuild_dir = "."
rebuild_args = ["run", "tools/dynamic_smoke_fixture_builder.zig"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "LIBSMOKE.SO"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/lib/libsmoke.so"

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/lib/libsmoke.so"
