schema_version = 1

[app]
id = "int80_bench"
kind = "zig"
role = "command"

[source.zig]
entry = "userland/programs/int80_bench.zig"

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "I80BENCH.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/int80_bench.elf"
