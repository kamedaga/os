schema_version = 1

[app]
id = "esp_server_smoke"
kind = "file"
role = "test"

[source.file]
path = ".artifacts/cmake/esp_server/esp_server_smoke.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_esp_server.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "ESPSMOKE.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/esp_server_smoke.elf"
