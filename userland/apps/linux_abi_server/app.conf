schema_version = 1

[app]
id = "linux_abi_server"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/linux_abi_server/linux_abi_server.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_linux_abi_server.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "LINUXABI.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/linux_abi_server.elf"

[startup]
publish = "rootfs"
action = "linux_abi_server"
name = "linux_abi_server"
label = "linux_abi_server"
load = "rootfs"
after = ["exec_service"]
requires = ["tty_service"]
provides = ["linux_abi_server"]
