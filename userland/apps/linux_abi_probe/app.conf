schema_version = 1

[app]
id = "linux_abi_probe"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/linux_abi_probe.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_linux_abi_probe.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "LNXABIPR.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/linux_abi_probe.elf"
