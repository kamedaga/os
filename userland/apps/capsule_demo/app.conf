schema_version = 1

[app]
id = "capsule_demo"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/capsule_demo.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_capsule_demo.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "CAPDEMO.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/capsule_demo.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/capsule_demo"
