schema_version = 1

[app]
id = "virtio_console"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/virtio_console/virtio_console.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_virtio_console.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "VCONDRV.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/virtio_console.elf"
