schema_version = 1

[app]
id = "virtio_console"
kind = "zig"
role = "service"

[source.zig]
entry = "userland/programs/virtio_console.zig"
module = "abi_root"

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "VCONDRV.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/virtio_console.elf"
