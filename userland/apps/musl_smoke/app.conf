schema_version = 1

[app]
id = "musl_smoke"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/musl_smoke.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_musl_smoke.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "MUSLSMOK.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/musl_smoke.elf"
