schema_version = 1

[app]
id = "busybox"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/busybox.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_busybox.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "BUSYBOX.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/busybox.elf"
