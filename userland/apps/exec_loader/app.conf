schema_version = 1

[app]
id = "exec_loader"
kind = "zig"
role = "service"

[source.zig]
entry = "userland/programs/exec_loader.zig"
module = "abi_root"

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "EXECLDR.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/exec_loader.elf"

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/exec_loader.elf"

