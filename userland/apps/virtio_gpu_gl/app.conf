schema_version = 1

[app]
id = "virtio_gpu_gl"
kind = "zig"
role = "service"

[source.zig]
entry = "userland/programs/virtio_gpu_gl.zig"
module = "support_root"

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "VGPUGL.ELF"
strip = true

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/virtio_gpu_gl.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/virtio_gpu_gl.elf"
