schema_version = 1

[app]
id = "dash"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/dash.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_dash.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "DASH.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/dash.elf"
