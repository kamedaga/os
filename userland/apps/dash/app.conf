schema_version = 1

[app]
id = "dash"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/shell/dash.elf"

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "DASH.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/dash.elf"

[[publish]]
id = "rootfs_interactive"
fs = "rootfs"
path = "/cmd/dash_interactive.elf"

[startup]
publish = "rootfs_interactive"
action = "linux_exec"
name = "dash"
label = "dash"
load = "rootfs"
after = ["linux_abi_server"]
requires = ["exec_service"]

[[publish]]
id = "bin_dash"
fs = "rootfs"
path = "/bin/dash"

[[publish]]
id = "bin_sh"
fs = "rootfs"
path = "/bin/sh"
