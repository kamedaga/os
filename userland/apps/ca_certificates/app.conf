schema_version = 1

[app]
id = "ca_certificates"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/ca-certificates.crt"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_ca_certificates.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "CA_CERTIFICATES.CRT"
strip = false

[[publish]]
id = "rootfs_ca_bundle"
fs = "rootfs"
path = "/etc/ssl/certs/ca-certificates.crt"

[[publish]]
id = "rootfs_openssl_default_ca_bundle"
fs = "rootfs"
path = "/etc/ssl/cert.pem"
