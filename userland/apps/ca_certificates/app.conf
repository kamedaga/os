schema_version = 1

[app]
id = "ca_certificates"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/ca-certificates.crt"

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "CA-CERTS.CRT"
strip = false

[[publish]]
id = "rootfs_bundle"
fs = "rootfs"
path = "/etc/ssl/certs/ca-certificates.crt"
