schema_version = 1

[app]
id = "ipc_pair_bench_server"
kind = "zig"
role = "command"

[source.zig]
entry = "userland/programs/ipc_pair_bench_server.zig"

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "IPCSRV.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/ipc_pair_bench_server.elf"
