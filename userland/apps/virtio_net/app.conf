schema_version = 1

[app]
id = "virtio_net"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/virtio_net/virtio_net.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_virtio_net.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "VNETDRV.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/virtio_net.elf"
