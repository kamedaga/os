schema_version = 1

[app]
id = "pie_user"
kind = "zig"
role = "command"

[source.zig]
entry = "userland/programs/pie_user.zig"
module = "support_root"
include_dirs = ["user/libcapc"]
c_sources = ["user/libcapc/capc.c", "user/libcapc/cap_errno.c"]
cflags = ["-ffreestanding", "-fno-stack-protector"]

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "USERAPP.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/pie_user.elf"
