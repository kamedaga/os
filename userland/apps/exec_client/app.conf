schema_version = 1

[app]
id = "exec_client"
kind = "file"
role = "demo"

[source.file]
path = ".artifacts/cmake/exec_client/exec_client.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_exec_client.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "EXECCLI.ELF"
strip = false

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/exec_client.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/exec_client.elf"

[startup]
publish = "bootfs"
action = "process_builder"
name = "exec_client"
label = "exec_client"
load = "bootfs"
after = ["exec_service"]
requires = ["exec_service"]
