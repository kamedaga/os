schema_version = 1

[app]
id = "rust_hello"
kind = "cargo"
role = "demo"

[source.cargo]
manifest = "user/rust/Cargo.toml"
package = "rust_hello"
bin = "rust_hello"
target = "x86_64-unknown-none"
target_dir = ".artifacts/cargo-target"

[build]
format = "pie-elf"
target = "x86_64-unknown-none"
optimize = "release"
output_name = "RUSTHEL.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/rust_hello.elf"
