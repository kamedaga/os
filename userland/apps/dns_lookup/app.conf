schema_version = 1

[app]
id = "dns_lookup"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/dns_lookup.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_dns_lookup.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "DNSLOOK.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/dns_lookup.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/dns_lookup"
