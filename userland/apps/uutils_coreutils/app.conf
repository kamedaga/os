schema_version = 1

[app]
id = "uutils_coreutils"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/uutils-coreutils.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_uutils_coreutils.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "COREUTIL.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/coreutils.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/coreutils"
