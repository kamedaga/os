schema_version = 1

[app]
id = "rust_wasmtime_memory_demo"
kind = "cargo"
role = "demo"

[source.cargo]
manifest = "userland/rust/Cargo.toml"
package = "rust_wasmtime_memory_demo"
bin = "rust_wasmtime_memory_demo"
target = "x86_64-unknown-none"
profile = "release"
target_dir = ".artifacts/cargo-target"

[build]
format = "elf"
target = "x86_64-freestanding-none"
optimize = "release"
output_name = "RWTMEM.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/rust_wasmtime_memory_demo.elf"
