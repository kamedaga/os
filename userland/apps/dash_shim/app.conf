schema_version = 1

[app]
id = "dash_shim"
kind = "file"
role = "tool"

[source.file]
path = ".artifacts/cmake/dash_shim/dash_shim.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_dash_shim.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "DASHSHIM.ELF"
strip = false

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/dash_shim.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/dash_shim.elf"

[startup]
publish = "bootfs"
action = "process_builder"
name = "dash_shim"
label = "dash_shim"
load = "bootfs"
after = ["exec_service"]
requires = ["exec_service"]
