schema_version = 1

[app]
id = "seed2_boot"
kind = "file"
role = "boot"

[source.file]
path = ".artifacts/cmake/seed2_boot/seed2_boot.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_seed2_boot.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "SEED2BT.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/seed2_boot.elf"
