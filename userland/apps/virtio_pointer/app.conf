schema_version = 1

[app]
id = "virtio_pointer"
kind = "zig"
role = "service"

[source.zig]
entry = "userland/programs/virtio_pointer.zig"
module = "abi_root"

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "VPTRDRV.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/virtio_pointer.elf"

[startup]
publish = "rootfs"
action = "input_driver"
name = "virtio_pointer"
label = "virtio_pointer"
load = "rootfs"
after = ["persistent_fs"]
requires = ["persistent_fs_service"]
provides = ["pointer_shared"]
input = ["pointer"]

