schema_version = 1

[app]
id = "wasmtime_writeback_module"
kind = "file"
role = "demo"

[source.file]
path = ".artifacts/wasm/wasmtime_writeback_module.cwasm"
rebuild_tool = "cargo"
rebuild_dir = "."
rebuild_args = ["run", "--manifest-path", "tools/wasmtime_artifact_builder/Cargo.toml", "--release", "--locked", "--", ".artifacts/wasm/wasmtime_writeback_module.cwasm", "memory-writeback-run"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "WBMOD.CWASM"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/sys/wasmtime_writeback_module.cwasm"
