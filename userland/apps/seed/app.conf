schema_version = 1

[app]
id = "seed"
kind = "file"
role = "boot"

[source.file]
path = "userland/seed_init/zig-out/bin/seed.elf"

[build]
format = "prebuilt"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "seed.elf"
strip = true

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/seed.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/seed.elf"
