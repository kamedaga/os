schema_version = 1

[app]
id = "gnu_grep"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/gnu-grep.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_gnu_grep.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "GNUGREP.ELF"
strip = false

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/grep"
