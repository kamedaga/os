schema_version = 1

[app]
id = "smoke_app"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/smoke_app.elf"
rebuild_tool = "zig"
rebuild_dir = "."
rebuild_args = ["run", "tools/dynamic_smoke_fixture_builder.zig"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "SMOKEAPP.ELF"
strip = false

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/cmd/smoke_app.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/smoke_app.elf"
