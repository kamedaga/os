schema_version = 1

[app]
id = "kobox_usb_storage"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/kobox-modules/usb-storage.ko"
rebuild = true
rebuild_args = ["-e", "bash", "tools/build_wsl_kobox_modules.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "USBSTOR.KO"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/usr/lib/kobox/usb-storage.ko"
