schema_version = 1

[app]
id = "pipe_tools"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/pipe_tools.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_pipe_tools.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "PIPETOOL.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/pipe_tools.elf"
