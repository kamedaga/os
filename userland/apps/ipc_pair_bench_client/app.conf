schema_version = 1

[app]
id = "ipc_pair_bench_client"
kind = "zig"
role = "command"

[source.zig]
entry = "userland/programs/ipc_pair_bench_client.zig"
module = "support_root"

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "IPCCLI.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/ipc_pair_bench_client.elf"
