schema_version = 1

[app]
id = "uutils_shim"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/uutils-shim.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_uutils_shim.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "UUTILSHM.ELF"
strip = false

[[publish]]
id = "cmd_uutils_shim"
fs = "rootfs"
path = "/cmd/uutils-shim.elf"

