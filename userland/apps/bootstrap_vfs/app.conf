schema_version = 1

[app]
id = "bootstrap_vfs"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/bootstrap_vfs/bootstrap_vfs.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_bootstrap_vfs.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "BOOTVFS.ELF"
strip = false

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/bootstrap_vfs.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/bootstrap_vfs.elf"
