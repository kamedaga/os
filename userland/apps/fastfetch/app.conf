schema_version = 1

[app]
id = "fastfetch"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/fastfetch.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_fastfetch.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "FASTFETCH.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/fastfetch.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/fastfetch"
