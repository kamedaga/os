schema_version = 1

[app]
id = "fat_server"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/rootfs_fat_server/fat_server.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_fat_server.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "FATSRV.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/fat_server.elf"

[startup]
publish = "rootfs"
action = "fat_server"
name = "fat_server"
label = "fat_server"
load = "rootfs"
after = ["persistent_fs"]
requires = ["persistent_fs_service"]
provides = ["fat_server_service"]
