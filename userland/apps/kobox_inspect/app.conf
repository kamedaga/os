schema_version = 1

[app]
id = "kobox_inspect"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/kobox/kobox-inspect.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_kobox.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "KOBOXINS.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/kobox-inspect.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/kobox-inspect"
