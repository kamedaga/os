schema_version = 1

[app]
id = "tty_service"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/tty_service/tty_service.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_tty_service.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "TTYSVC.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/tty_service.elf"

[startup]
publish = "rootfs"
action = "process_builder"
name = "tty_service"
label = "tty_service"
load = "rootfs"
requires = ["vfs_service"]
provides = ["tty_service"]
