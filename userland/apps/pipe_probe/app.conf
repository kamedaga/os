schema_version = 1

[app]
id = "pipe_probe"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/pipe_probe.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_pipe_probe.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "PIPEPROB.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/pipe_probe.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/pipe_probe"
