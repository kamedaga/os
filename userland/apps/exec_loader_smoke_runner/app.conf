schema_version = 1

[app]
id = "exec_loader_smoke_runner"
kind = "zig"
role = "demo"

[source.zig]
entry = "userland/programs/exec_loader_smoke_runner.zig"
module = "abi_root"

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "EXECSMOK.ELF"
strip = true

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/exec_loader_smoke_runner.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/exec_loader_smoke_runner.elf"

[startup]
publish = "bootfs"
action = "process_builder"
name = "exec_loader_smoke"
label = "exec_loader_smoke"
load = "bootfs"
after = ["rootfs_vfs"]
