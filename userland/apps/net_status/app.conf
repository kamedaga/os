schema_version = 1

[app]
id = "net_status"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/net_status.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_net_status.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "NETSTAT.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/net_status.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/net_status"
