schema_version = 1

[app]
id = "pachafetch"
kind = "cargo"
role = "app"

[source.cargo]
manifest = "user/rust/Cargo.toml"
package = "pachafetch"
bin = "pachafetch"
target = "x86_64-unknown-none"
target_dir = ".artifacts/cargo-target"

[build]
format = "pie-elf"
target = "x86_64-unknown-none"
optimize = "release"
output_name = "PCHFETCH.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/pachafetch.elf"
