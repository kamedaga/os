schema_version = 1

[app]
id = "tcp_http_get"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/tcp_http_get.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_tcp_http_get.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "TCPGET.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/tcp_http_get.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/tcp_http_get"
