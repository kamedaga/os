schema_version = 1

[app]
id = "rtc_status"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/rtc_status.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_rtc_status.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "RTCSTAT.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/rtc_status.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/rtc_status"
