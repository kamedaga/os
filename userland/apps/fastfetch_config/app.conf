schema_version = 1

[app]
id = "fastfetch_config"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/fastfetch-capabilityos.jsonc"

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "CAPFF.JSONC"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/share/fastfetch/capabilityos.jsonc"

[[publish]]
id = "rootfs_default"
fs = "rootfs"
path = "/etc/fastfetch/config.jsonc"
