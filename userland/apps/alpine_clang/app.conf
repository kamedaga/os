schema_version = 1

[app]
id = "alpine_clang"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/alpine-clang-root"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_alpine_clang.sh"]

[build]
format = "tree"
target = ""
optimize = "release"
output_name = "ROOT"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/"
