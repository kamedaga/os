schema_version = 1

[app]
id = "rootfs_vfs"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/rootfs_vfs/rootfs_vfs.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_rootfs_vfs.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "ROOTVFS.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/rootfs_vfs.elf"
