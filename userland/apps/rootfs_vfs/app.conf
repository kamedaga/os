schema_version = 1

[app]
id = "rootfs_vfs"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/rootfs_vfs/rootfs_vfs.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_rootfs_vfs.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "ROOTVFS.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/rootfs_vfs.elf"

[startup]
publish = "rootfs"
action = "vfs"
name = "rootfs_vfs"
label = "rootfs_vfs"
load = "rootfs"
after = ["fat_server"]
requires = ["block_service", "persistent_fs_service"]
provides = ["vfs_service"]
