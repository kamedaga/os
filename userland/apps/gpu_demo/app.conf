schema_version = 1

[app]
id = "gpu_demo"
kind = "zig"
role = "command"

[source.zig]
entry = "userland/programs/gpu_demo.zig"
module = "support_root"

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "GPUDEMO.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/gpu_demo.elf"
