schema_version = 1

[app]
id = "mbedcrypto"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/userland-fixtures/libmbedcrypto.so.16"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_mbedtls.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "LIBMBEDCRYPTO.SO.16"
strip = false

[[publish]]
id = "rootfs-soname"
fs = "rootfs"
path = "/lib/libmbedcrypto.so.16"

[[publish]]
id = "rootfs-linker"
fs = "rootfs"
path = "/lib/libmbedcrypto.so"
