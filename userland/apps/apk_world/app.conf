schema_version = 1

[app]
id = "apk_world"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/apk-world"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_apk_config.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "APKWORLD.TXT"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/etc/apk/world"
