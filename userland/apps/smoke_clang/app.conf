schema_version = 1

[app]
id = "smoke_clang"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/smoke_clang.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_clang_smoke.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "SMOKECLANG.ELF"
strip = false

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/cmd/smoke_clang.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/smoke_clang.elf"
