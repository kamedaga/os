schema_version = 1

[app]
id = "apk"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/apk.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_apk_tools.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "APK.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/apk.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/apk"

[[publish]]
id = "rootfs_usr_bin"
fs = "rootfs"
path = "/usr/bin/apk"
