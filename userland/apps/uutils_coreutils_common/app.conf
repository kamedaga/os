schema_version = 1

[app]
id = "uutils_coreutils_common"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/uutils-coreutils-common.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_uutils_coreutils_common.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "CORECOMN.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/coreutils-common.elf"
