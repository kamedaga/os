schema_version = 1

[app]
id = "persistent_fs"
kind = "zig"
role = "service"

[source.zig]
entry = "userland/programs/persistent_fs.zig"
module = "support_root"
imports = ["support_root", "persistent_fs_layout"]

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "PERSFS.ELF"
strip = true

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/persistent_fs.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/persistent_fs.elf"

[startup]
publish = "bootfs"
action = "persistent_fs"
name = "persistent_fs"
label = "persistent_fs"
load = "bootfs"
after = ["block"]
requires = ["block_service"]
provides = ["rootfs_fs"]
