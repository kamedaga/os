schema_version = 1

[app]
id = "persistent_fs"
kind = "zig"
role = "service"

[source.zig]
entry = "userland/programs/persistent_fs.zig"
module = "abi_root"
imports = ["abi_root", "persistent_fs_layout"]

[build]
format = "pie-elf"
target = "x86_64-freestanding-none"
optimize = "ReleaseSmall"
output_name = "PERSFS.ELF"
strip = true

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/persistent_fs.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/persistent_fs.elf"


