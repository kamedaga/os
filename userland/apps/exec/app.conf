schema_version = 1

[app]
id = "exec"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/exec/exec.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_exec.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "EXEC.ELF"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/exec.elf"
