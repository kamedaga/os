schema_version = 1

[app]
id = "libsmoke_clang"
kind = "file"
role = "service"

[source.file]
path = "userland/fixtures/libsmoke_clang.so"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_clang_smoke.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "LIBSMCLANG.SO"
strip = false

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/lib/libsmoke_clang.so"

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/lib/libsmoke_clang.so"
