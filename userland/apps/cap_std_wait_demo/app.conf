schema_version = 1

[app]
id = "cap_std_wait_demo"
kind = "cargo"
role = "demo"

[source.cargo]
manifest = "user/rust/Cargo.toml"
package = "cap_std_wait_demo"
bin = "cap_std_wait_demo"
target = "x86_64-unknown-none"
target_dir = ".artifacts/cargo-target"

[build]
format = "pie-elf"
target = "x86_64-unknown-none"
optimize = "release"
output_name = "CAPWAIT.ELF"
strip = true

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/cmd/cap_std_wait_demo.elf"
