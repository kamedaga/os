schema_version = 1

[app]
id = "uutils_coreutils_hot"
kind = "file"
role = "asset"

[source.file]
path = "userland/fixtures/uutils-coreutils-hot.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_uutils_coreutils_hot.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "COREHOT.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/coreutils-hot.elf"
