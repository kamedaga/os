schema_version = 1

[app]
id = "net_bench"
kind = "file"
role = "asset"

[source.file]
path = ".artifacts/userland-fixtures/net_bench.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_net_bench.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "NETBENCH.ELF"
strip = false

[[publish]]
id = "rootfs_cmd"
fs = "rootfs"
path = "/cmd/net_bench.elf"

[[publish]]
id = "rootfs_bin"
fs = "rootfs"
path = "/bin/net_bench"
