schema_version = 1

[app]
id = "exec_service"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/cmake/exec_service/exec_service.elf"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_exec_service.sh"]

[build]
format = "prebuilt"
target = ""
optimize = "release"
output_name = "EXECSVC.ELF"
strip = false

[[publish]]
id = "bootfs"
fs = "bootfs"
path = "/srv/exec_service.elf"

[[publish]]
id = "rootfs"
fs = "rootfs"
path = "/srv/exec_service.elf"

[startup]
publish = "bootfs"
action = "process_builder"
name = "exec_service"
label = "exec_service"
load = "bootfs"
after = ["rootfs_vfs"]
requires = ["vfs_service"]
provides = ["exec_service"]
