schema_version = 1

[app]
id = "mbedx509"
kind = "file"
role = "service"

[source.file]
path = ".artifacts/userland-fixtures/libmbedx509.so.7"
rebuild_tool = "wsl"
rebuild_dir = "."
rebuild_args = ["-e", "bash", "tools/build_wsl_mbedtls.sh"]

[build]
format = "blob"
target = ""
optimize = "release"
output_name = "LIBMBEDX509.SO.7"
strip = false

[[publish]]
id = "rootfs-soname"
fs = "rootfs"
path = "/lib/libmbedx509.so.7"

[[publish]]
id = "rootfs-linker"
fs = "rootfs"
path = "/lib/libmbedx509.so"
