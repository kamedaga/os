[workspace]
members = [
    "rust_wasmtime_platform_demo",
    "rust_wasmtime_host_demo",
    "rust_wasmtime_loader_demo",
    "rust_wasmtime_hostcall_demo",
    "rust_wasmtime_memory_demo",
    "rust_wasmtime_writeback_demo",
    "rust_wasmtime_trap_demo",
    "rust_gl_query_demo",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = false
codegen-units = 1
strip = "symbols"
