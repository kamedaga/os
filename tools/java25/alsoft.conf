# The guest's standard OSS PCM device is backed by Linux ALSA/virtio-sound.
# QEMU PA output was verified with out.buffer-length=10000,out.latency=10000
# and timer-period=1000; its default buffer can coalesce a full OSS-ring advance.
# An unavailable device must fail; never silently select OpenAL's null output.
drivers = oss
frequency = 48000
channels = stereo
sample-type = int16
[oss]
device = /dev/dsp
