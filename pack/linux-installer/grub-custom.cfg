# Loaded by the unmodified SystemRescue GRUB configuration.
set timeout=5
set default='Linux maintenance (USB recovery)'
unset fallback
menuentry 'Linux maintenance (USB recovery)' {
    set gfxpayload=keep
    linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=RESCUE1302 iomem=relaxed nomdlvm nomodeset console=tty0 usbcore.old_scheme_first=1 usbcore.initial_descriptor_timeout=10000 usbcore.autosuspend=-1
    initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}
menuentry 'PachaOS installer (Linux Live)' {
    set gfxpayload=keep
    linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=RESCUE1302 iomem=relaxed nomdlvm nomodeset console=ttyS0,115200n8 console=tty0
    initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}
