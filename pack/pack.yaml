schema: 1
name: "CapabilityOS"
artifacts: ".artifacts"
state: ".artifacts/pack"
kernel:
  dir: "kernel"
  step: "limine"
disk:
  image: ".artifacts/disk.img"
  sizeMiB: 4096
  recreate: "if-missing"
  partitions:
    esp:
      index: 1
      format: "fat32"
      sizeMiB: 192
      grow: false
    rootfs:
      index: 2
      format: "ext4"
      grow: true
manifests:
  dir: ".artifacts/manifests"
  bootfs: ".artifacts/manifests/bootfs.generated.txt"
  rootfs: ".artifacts/manifests/rootfs.generated.txt"
  startup: ".artifacts/manifests/startup.generated.txt"
startupManifest:
  path: "/sys/startup_manifest.txt"
  include: ["rootfs"]
rootfsDirs: ["/cmd", "/bin", "/sbin", "/usr", "/usr/bin", "/usr/lib", "/usr/lib/uutils", "/srv", "/dev", "/etc", "/etc/apk", "/etc/apk/keys", "/etc/ssl", "/etc/ssl/certs", "/etc/fastfetch", "/sys", "/tmp", "/var", "/var/cache", "/var/cache/apk", "/lib", "/lib/linux", "/lib/pacha", "/lib/apk", "/lib/apk/db", "/var/lib", "/var/lib/apk", "/home", "/share", "/share/fastfetch", "/share/fonts"]
skip:
  apps:
    - "alpine_clang"
    - "alpine_go"
    - "alpine_key_4a6a0840"
    - "alpine_key_5243ef4b"
    - "alpine_key_5261cecb"
    - "alpine_key_6165ee59"
    - "alpine_key_61666e3f"
    - "apk"
    - "apk_arch"
    - "apk_repositories"
    - "apk_world"
    - "ca_certificates"
    - "capsule_demo"
    - "curl"
    - "dash"
    - "dns_lookup"
    - "esp_server"
    - "esp_server_smoke"
    - "exec"
    - "exec_service"
    - "fastfetch"
    - "fat_server"
    - "gnu_grep"
    - "go_vm_pressure_probe"
    - "kobox_hid"
    - "kobox_hid_generic"
    - "kobox_inspect"
    - "kobox_ls_devices"
    - "kobox_run"
    - "kobox_usb_storage"
    - "kobox_usbcore"
    - "kobox_usbhid"
    - "kobox_xhci_hcd"
    - "kobox_xhci_pci"
    - "libc_musl"
    - "linux_abi_probe"
    - "linux_abi_server"
    - "mbedcrypto"
    - "mbedtls"
    - "mbedx509"
    - "musl_smoke"
    - "net_bench"
    - "net_status"
    - "pachaos_capsule"
    - "pipe_probe"
    - "pipe_tools"
    - "rootfs_vfs"
    - "rtc_status"
    - "seed0_next"
    - "seed2_boot"
    - "seed2_root"
    - "tcp_http_get"
    - "tty_service"
    - "uutils_coreutils"
    - "uutils_coreutils_common"
    - "uutils_coreutils_hot"
    - "uutils_shim"
    - "virtio_console"
    - "virtio_net"
    - "zlib"
    - "zstd"
  kinds: []
  includeSkippedArtifacts: false
apps:
  alpine_clang:
    file:
      path: ".artifacts/userland-fixtures/alpine-clang-root"
      rebuild: ["bash", "tools/build_wsl_alpine_clang.sh"]
    out: "ROOT"
    rootfs: "/"
  alpine_go:
