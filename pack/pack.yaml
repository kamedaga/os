schema: 1
name: "CapabilityOS"
artifacts: ".artifacts"
state: ".artifacts/pack"
storage:
  sandboxRAMMiB: 512
  queueSize: 64
  queueArenaMiB: 16
kernel:
  dir: "kernel"
  step: "limine"
disk:
  image: ".artifacts/disk.img"
  sizeMiB: 4096
  recreate: "if-missing"
  partitions:
    esp:
      index: 1
      format: "fat32"
      sizeMiB: 192
      grow: false
    rootfs:
      index: 2
      format: "ext4"
      grow: true
manifests:
  dir: ".artifacts/manifests"
  bootfs: ".artifacts/manifests/bootfs.generated.txt"
  rootfs: ".artifacts/manifests/rootfs.generated.txt"
  startup: ".artifacts/manifests/startup.generated.txt"
startupManifest:
  path: "/sys/startup_manifest.txt"
  include: ["rootfs"]
# Overlay expansion omits empty directories. Desktop must exist before
# xfdesktop constructs its regular-file icons on the first login.
rootfsDirs: ["/cmd", "/bin", "/sbin", "/usr", "/usr/bin", "/usr/lib", "/usr/libexec", "/usr/lib/uutils", "/srv", "/dev", "/dev/dri", "/dev/input", "/dev/shm", "/etc", "/etc/apk", "/etc/apk/keys", "/etc/ssl", "/etc/ssl/certs", "/etc/fastfetch", "/proc", "/proc/sys", "/proc/sys/kernel", "/sys", "/sys/dev", "/sys/dev/block", "/sys/dev/char", "/sys/class", "/sys/class/drm", "/sys/class/input", "/tmp", "/var", "/var/cache", "/var/cache/apk", "/var/log", "/lib", "/lib/linux", "/lib/pacha", "/lib/apk", "/lib/apk/db", "/var/lib", "/var/lib/apk", "/opt", "/opt/apk-offline", "/opt/apk-offline/bin", "/opt/apk-offline/lib", "/home", "/root/Desktop", "/share", "/share/fastfetch", "/share/fonts", "/run", "/etc/polkit-1/rules.d", "/usr/local/share/polkit-1/rules.d", "/etc/polkit-1/actions", "/usr/local/share/polkit-1/actions"]
