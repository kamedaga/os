schema: 1
# This is the RAM-only console payload, not the installed rootfs.  Keep it
# separate from pack.yaml's normal bootfs so ordinary boots stay unchanged.
# The existing BusyBox fetch uses latest-stable; pin the extracted binary here
# so a future installer image cannot silently change its shell on rebuild.
