schema_version = 1

[workspace]
name = "CapabilityOS"
root = "."

[artifacts]
dir = ".artifacts"
state_dir = ".artifacts/pactl"

[kernel]
dir = "kernel"
default_step = "efi"

[userland]
apps_dir = "userland/apps"
skip_kinds = []
# Active userland is intentionally small. Legacy `/lib/ld.so` smoke fixtures
# and the old GPU driver were retired; musl dynamic ELF uses
# /lib/ld-musl-x86_64.so.1.
skip_apps = ["alpine_clang", "persistent_fs", "seed", "shell"]
include_skipped_artifacts_in_manifests = false

[disk]
image = ".artifacts/disk.img"
size_mib = 4096
recreate = "if-missing"

[[disk.partition]]
id = "esp"
index = 1
format = "fat16"
size_mib = 192

[[disk.partition]]
id = "rootfs"
index = 2
format = "capfs"
grow = true

[manifests]
dir = ".artifacts/manifests"
bootfs = ".artifacts/manifests/bootfs.generated.txt"
rootfs = ".artifacts/manifests/rootfs.generated.txt"
startup = ".artifacts/manifests/startup.generated.txt"

[startup_manifest]
path = "/sys/startup_manifest.txt"
include = ["rootfs"]

[[publish_dir]]
fs = "rootfs"
path = "/cmd"

[[publish_dir]]
fs = "rootfs"
path = "/bin"

[[publish_dir]]
fs = "rootfs"
path = "/usr"

[[publish_dir]]
fs = "rootfs"
path = "/usr/bin"

[[publish_dir]]
fs = "rootfs"
path = "/usr/lib"

[[publish_dir]]
fs = "rootfs"
path = "/usr/lib/uutils"

[[publish_dir]]
fs = "rootfs"
path = "/srv"

[[publish_dir]]
fs = "rootfs"
path = "/dev"

[[publish_dir]]
fs = "rootfs"
path = "/etc"

[[publish_dir]]
fs = "rootfs"
path = "/etc/apk"

[[publish_dir]]
fs = "rootfs"
path = "/etc/apk/keys"

[[publish_dir]]
fs = "rootfs"
path = "/etc/ssl"

[[publish_dir]]
fs = "rootfs"
path = "/etc/ssl/certs"

[[publish_dir]]
fs = "rootfs"
path = "/etc/fastfetch"

[[publish_dir]]
fs = "rootfs"
path = "/sys"

[[publish_dir]]
fs = "rootfs"
path = "/tmp"

[[publish_dir]]
fs = "rootfs"
path = "/var"

[[publish_dir]]
fs = "rootfs"
path = "/var/cache"

[[publish_dir]]
fs = "rootfs"
path = "/var/cache/apk"

[[publish_dir]]
fs = "rootfs"
path = "/lib"

[[publish_dir]]
fs = "rootfs"
path = "/lib/apk"

[[publish_dir]]
fs = "rootfs"
path = "/lib/apk/db"

[[publish_dir]]
fs = "rootfs"
path = "/var/lib"

[[publish_dir]]
fs = "rootfs"
path = "/var/lib/apk"

[[publish_dir]]
fs = "rootfs"
path = "/home"

[[publish_dir]]
fs = "rootfs"
path = "/share"

[[publish_dir]]
fs = "rootfs"
path = "/share/fastfetch"

[[publish_dir]]
fs = "rootfs"
path = "/share/fonts"

[toolchain]
zig = "zig"
cargo = "cargo"
pwsh = "pwsh.exe"
