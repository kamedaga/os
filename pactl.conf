schema_version = 1

[workspace]
name = "CapabilityOS"
root = "."

[artifacts]
dir = ".artifacts"
state_dir = ".artifacts/pactl"

[kernel]
dir = "kernel"
default_step = "efi"

[userland]
apps_dir = "userland/apps"
skip_kinds = []
skip_apps = ["cap_std_child_exit_demo", "cap_std_exec_demo", "cap_std_fs_demo", "cap_std_wait_demo", "rust_fs_demo", "rust_fs_mut_demo", "rust_gl_query_demo", "rust_hello", "rust_open_exec_demo", "rust_spawn_demo", "rust_wasmtime_host_demo", "rust_wasmtime_hostcall_demo", "rust_wasmtime_loader_demo", "rust_wasmtime_memory_demo", "rust_wasmtime_platform_demo", "rust_wasmtime_trap_demo", "rust_wasmtime_writeback_demo", "wasmtime_hostcall_module", "wasmtime_memory_module", "wasmtime_minimal_module", "wasmtime_minimal_wasm_module", "wasmtime_trap_module", "wasmtime_writeback_module"]
include_skipped_artifacts_in_manifests = false

[disk]
image = ".artifacts/disk.img"
size_mib = 512
recreate = "if-missing"

[[disk.partition]]
id = "esp"
index = 1
format = "fat16"
size_mib = 192

[[disk.partition]]
id = "rootfs"
index = 2
format = "capfs"
grow = true

[manifests]
dir = ".artifacts/manifests"
bootfs = ".artifacts/manifests/bootfs.generated.txt"
rootfs = ".artifacts/manifests/rootfs.generated.txt"
startup = ".artifacts/manifests/startup.generated.txt"

[startup_manifest]
path = "/sys/startup_manifest.txt"
include = ["bootfs", "rootfs"]

[[publish_dir]]
fs = "rootfs"
path = "/cmd"

[[publish_dir]]
fs = "rootfs"
path = "/srv"

[[publish_dir]]
fs = "rootfs"
path = "/dev"

[[publish_dir]]
fs = "rootfs"
path = "/sys"

[[publish_dir]]
fs = "rootfs"
path = "/tmp"

[[publish_dir]]
fs = "rootfs"
path = "/home"

[toolchain]
zig = "zig"
cargo = "cargo"
pwsh = "pwsh.exe"
