schema_version = 1

[workspace]
name = "CapabilityOS"
root = "."

[artifacts]
dir = ".artifacts"
state_dir = ".artifacts/pactl"

[kernel]
dir = "kernel"
default_step = "efi"

[userland]
apps_dir = "userland/apps"
skip_kinds = []
# Active userland is intentionally small:
#   seed, virtio_blk, persistent_fs, shell, virtio_gpu_gl, virtio_pointer,
#   exec_loader, exec_service, exec_client, linux_abi_server, ld,
#   smoke_app, libsmoke, smoke_clang, libsmoke_clang.
# Legacy apps live under legacy/userland/apps and are outside pactl discovery.
skip_apps = []
include_skipped_artifacts_in_manifests = false

[disk]
image = ".artifacts/disk.img"
size_mib = 512
recreate = "if-missing"

[[disk.partition]]
id = "esp"
index = 1
format = "fat16"
size_mib = 192

[[disk.partition]]
id = "rootfs"
index = 2
format = "capfs"
grow = true

[manifests]
dir = ".artifacts/manifests"
bootfs = ".artifacts/manifests/bootfs.generated.txt"
rootfs = ".artifacts/manifests/rootfs.generated.txt"
startup = ".artifacts/manifests/startup.generated.txt"

[startup_manifest]
path = "/sys/startup_manifest.txt"
include = ["bootfs", "rootfs"]

[[publish_dir]]
fs = "rootfs"
path = "/cmd"

[[publish_dir]]
fs = "rootfs"
path = "/srv"

[[publish_dir]]
fs = "rootfs"
path = "/dev"

[[publish_dir]]
fs = "rootfs"
path = "/sys"

[[publish_dir]]
fs = "rootfs"
path = "/tmp"

[[publish_dir]]
fs = "rootfs"
path = "/home"

[[publish_dir]]
fs = "rootfs"
path = "/share"

[[publish_dir]]
fs = "rootfs"
path = "/share/fonts"

[toolchain]
zig = "zig"
cargo = "cargo"
pwsh = "pwsh.exe"
